<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morii assets</title>
    <meta name="description" content="Internal MoriiTalks asset catalog." />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body class="bg-cream font-sans text-ink antialiased">
    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Morii assets</h1>
          <p class="mt-1 text-sm text-muted" id="catalog-status" role="status">Loading assets…</p>
        </div>
        <a
          class="inline-flex min-h-11 items-center text-sm font-medium text-teal underline-offset-4 hover:underline"
          href="/manifest.json"
          >Manifest</a
        >
      </header>
      <section
        class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
        id="gallery"
        aria-label="Morii asset exports"
      ></section>
      <noscript>
        <p>Enable JavaScript to view assets, or open <a href="/manifest.json">the manifest</a>.</p>
      </noscript>
    </main>
    <dialog class="model-preview" id="model-preview" aria-labelledby="model-title">
      <header class="flex items-center justify-between gap-4 px-5 pt-4">
        <h2 class="text-lg font-semibold" id="model-title">Morii 3D</h2>
        <form method="dialog">
          <button class="model-control" type="submit" aria-label="Close 3D preview">Close</button>
        </form>
      </header>
      <div class="model-stage" id="model-stage"></div>
      <div class="flex flex-wrap items-center justify-center gap-3 px-5 pb-3">
        <label class="sr-only" for="model-animation">Animation</label>
        <select class="model-control" id="model-animation" disabled></select>
        <button class="model-control model-play" id="model-play" type="button" disabled>
          Play
        </button>
        <button class="model-control" id="model-pause" type="button" disabled>Pause</button>
        <label class="inline-flex min-h-11 items-center gap-2 text-sm">
          <input id="model-card" type="checkbox" disabled />
          Presentation card
        </label>
      </div>
      <p class="px-5 pb-4 text-center text-sm text-muted" id="model-status" role="status"></p>
    </dialog>
  </body>
</html>
